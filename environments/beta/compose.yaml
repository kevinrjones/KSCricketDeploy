# =============================================================================
# Beta Environment - Docker Compose
# =============================================================================
# Secrets are file contents under private/beta/ mounted
# at /run/secrets/<name>. ASP.NET apps (ids, adminui) load them via KeyPerFile.
# ACS API overlays /run/secrets onto its config map. MariaDB uses *_PASSWORD_FILE.
# Do NOT put secret file paths into app env vars as if they were the secret values.
# =============================================================================

name: acs-beta

services:
  # ---- MariaDB ----
  # MariaDB hosts multiple databases:
  #   - identity: IdentityServer and AdminUI
  #   - cricketarchive: ACS API
  #   - cricket: additional cricket database
  # The initialization script in ../../mariadb/init runs automatically on first volume startup.
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_DATABASE: ${MARIADB_DATABASE:-identity}
      MARIADB_USER: ${MARIADB_USER:-identity}
      IDS_HOSTNAME: ${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
      ADMINUI_HOSTNAME: ${ADMINUI_HOSTNAME:-adminui-beta.knowledgespike.cricket}
      ACS_WEB_HOSTNAME: ${ACS_WEB_HOSTNAME:-web-beta.knowledgespike.cricket}
      ACS_API_HOSTNAME: ${ACS_API_HOSTNAME:-api-beta.knowledgespike.cricket}
      BBB_WEB_HOSTNAME: ${BBB_WEB_HOSTNAME:-bbb-beta.knowledgespike.cricket}
      BBB_API_HOSTNAME: ${BBB_API_HOSTNAME:-bbb-api-beta.knowledgespike.cricket}
    secrets:
      - mariadb_root_password
      - mariadb_password
      - jdbc.username
      - jdbc.password
      - AdminUIClientSecret
    volumes:
      - ../../mariadb/init:/docker-entrypoint-initdb.d:ro
      - beta-mariadb-data:/var/lib/mysql
    networks:
      - acs-net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- IdentityServer (ids) ----
  # Loads every file in /run/secrets as config (ConnectionStrings__identity → ConnectionStrings:identity).
  ids:
    image: ${IDS_IMAGE:?Set IDS_IMAGE in environments/beta/.env}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      # Non-secret public URL (must match nginx Host + OIDC issuer)
      PublicOrigin: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
      # DP PFX path inside the container (file is volume-mounted; password is a secret file)
      DataProtection__Certificate__Path: /run/certs/ids-mysql-dp.pfx
    secrets:
      - ConnectionStrings__identity
      - DataProtection__Certificate__Password
      - Authentication__Google__ClientId
      - Authentication__Google__ClientSecret
    volumes:
      - beta-ids-logs:/app/logs
      - ../../certs/beta/ids-mysql-dp.pfx:/run/certs/ids-mysql-dp.pfx:ro
    networks:
      - acs-net
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/health/ready | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ---- AdminUI ----
  # KeyPerFile: secret *filenames* must be LicenseKey, AdminUIClientSecret, etc.
  adminui:
    image: ${ADMINUI_IMAGE:?Set ADMINUI_IMAGE in environments/beta/.env}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      UiUrl: https://${ADMINUI_HOSTNAME:-adminui-beta.knowledgespike.cricket}
      AuthorityUrl: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
      RequireHttpsMetadata: "true"
    secrets:
      - LicenseKey
      - AdminUIClientSecret
      - UsernamePolicy__Secret
      - IdentityConnectionString
      - IdentityServerConnectionString
    volumes:
      - beta-adminui-logs:/app/logs
    networks:
      - acs-net
    depends_on:
      mariadb:
        condition: service_healthy
      ids:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ---- ACS Web ----
  # Reads OIDC_* from environment (not KeyPerFile). Client secret comes from .env.
  acs-web:
    image: ${ACS_WEB_IMAGE:?Set ACS_WEB_IMAGE in environments/beta/.env}
    restart: unless-stopped
    environment:
      DEVELOPMENT: "false"
      PORT: "5002"
      HOST: 0.0.0.0
      OIDC_AUTHORITY: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
      OIDC_CLIENT_ID: ${STATS_OIDC_CLIENT_ID:-acsstats}
      OIDC_CLIENT_SECRET: ${STATS_OIDC_CLIENT_SECRET:?Set STATS_OIDC_CLIENT_SECRET in environments/beta/.env}
      OIDC_REDIRECT_URI: https://${ACS_WEB_HOSTNAME:-web-beta.knowledgespike.cricket}/signin-oidc
      OIDC_POST_LOGOUT_REDIRECT_URI: https://${ACS_WEB_HOSTNAME:-web-beta.knowledgespike.cricket}/
      API_BASE_URL: https://${ACS_API_HOSTNAME:-api-beta.knowledgespike.cricket}
      KTOR_ENVIRONMENT: beta
    volumes:
      - beta-acs-web-logs:/opt/app/logs
    networks:
      - acs-net
    depends_on:
      ids:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:5002/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---- ACS API ----
  # HOCON + env for URL/issuer; jdbc.username / jdbc.password files in /run/secrets override.
  acs-api:
    image: ${ACS_API_IMAGE:?Set ACS_API_IMAGE in environments/beta/.env}
    restart: unless-stopped
    environment:
      DEVELOPMENT: "false"
      PORT: "5004"
      HOST: 0.0.0.0
      JDBCURL: jdbc:mariadb://mariadb:3306/cricketarchive
      JWKSURL: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}/.well-known/openid-configuration/jwks
      ISSUER: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
      CORS_ORIGINS: https://${ACS_WEB_HOSTNAME:-web-beta.knowledgespike.cricket}
    secrets:
      - jdbc.username
      - jdbc.password
    volumes:
      - beta-acs-api-logs:/opt/app/logs
    networks:
      - acs-net
    depends_on:
      mariadb:
        condition: service_healthy
      ids:
        condition: service_healthy

  bbb-web:
    image: ${BBB_WEB_IMAGE:?Set BBB_WEB_IMAGE in environments/beta/.env}
    restart: unless-stopped
    environment:
      DEVELOPMENT: "false"
      PORT: "5002"
      HOST: 0.0.0.0
      OIDC_AUTHORITY: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
      OIDC_CLIENT_ID: ${BBB_OIDC_CLIENT_ID:-acsstats}
      OIDC_CLIENT_SECRET: ${BBB_OIDC_CLIENT_SECRET:?Set BBB_OIDC_CLIENT_SECRET in environments/beta/.env}
      OIDC_REDIRECT_URI: https://${BBB_WEB_HOSTNAME:-bbb-beta.knowledgespike.cricket}/signin-oidc
      OIDC_POST_LOGOUT_REDIRECT_URI: https://${BBB_WEB_HOSTNAME:-bbb-beta.knowledgespike.cricket}/
      API_BASE_URL: https://${BBB_API_HOSTNAME:-bbb-api-beta.knowledgespike.cricket}
      KTOR_ENVIRONMENT: beta
    volumes:
      - beta-acs-web-logs:/opt/app/logs
    networks:
      - acs-net
    depends_on:
      ids:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:5002/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---- ACS API ----
  # HOCON + env for URL/issuer; jdbc.username / jdbc.password files in /run/secrets override.
  bbb-api:
    image: ${ACS_API_IMAGE:?Set ACS_API_IMAGE in environments/beta/.env}
    restart: unless-stopped
    environment:
      DEVELOPMENT: "false"
      PORT: "5004"
      HOST: 0.0.0.0
      JDBCURL: jdbc:mariadb://mariadb:3306/cricketarchive
      JWKSURL: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}/.well-known/openid-configuration/jwks
      ISSUER: https://${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
      CORS_ORIGINS: https://${BBB_WEB_HOSTNAME:-web-beta.knowledgespike.cricket}
    secrets:
      - jdbc.username
      - jdbc.password
    volumes:
      - beta-acs-api-logs:/opt/app/logs
    networks:
      - acs-net
    depends_on:
      mariadb:
        condition: service_healthy
      ids:
        condition: service_healthy
        
  # ---- Edge Nginx ----
  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/beta.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../certs/beta/server.crt:/etc/nginx/certs/server.crt:ro
      - ../../certs/beta/server.key:/etc/nginx/certs/server.key:ro
    networks:
      acs-net:
        aliases:
          - ${IDS_HOSTNAME:-ids-beta.knowledgespike.cricket}
          - ${ADMINUI_HOSTNAME:-adminui-beta.knowledgespike.cricket}
          - ${ACS_WEB_HOSTNAME:-web-beta.knowledgespike.cricket}
          - ${ACS_API_HOSTNAME:-api-beta.knowledgespike.cricket}
          - ${BBB_WEB_HOSTNAME:-bbb-beta.knowledgespike.cricket}
          - ${BBB_API_HOSTNAME:-bbb-api-beta.knowledgespike.cricket}
    depends_on:
      ids:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  acs-net:
    name: acs-beta-net

volumes:
  beta-mariadb-data:
    name: beta-mariadb-data
  beta-ids-logs:
    name: beta-ids-logs
  beta-adminui-logs:
    name: beta-adminui-logs
  beta-acs-web-logs:
    name: beta-acs-web-logs
  beta-acs-api-logs:
    name: beta-acs-api-logs

# Each secret file's *basename* is the name inside /run/secrets/
secrets:
  mariadb_root_password:
    file: ../../private/beta/mariadb_root_password
  mariadb_password:
    file: ../../private/beta/mariadb_password

  ConnectionStrings__identity:
    file: ../../private/beta/ConnectionStrings__identity
  DataProtection__Certificate__Password:
    file: ../../private/beta/DataProtection__Certificate__Password
  Authentication__Google__ClientId:
    file: ../../private/beta/Authentication__Google__ClientId
  Authentication__Google__ClientSecret:
    file: ../../private/beta/Authentication__Google__ClientSecret

  LicenseKey:
    file: ../../private/beta/LicenseKey
  AdminUIClientSecret:
    file: ../../private/beta/AdminUIClientSecret
  UsernamePolicy__Secret:
    file: ../../private/beta/UsernamePolicy__Secret
  IdentityConnectionString:
    file: ../../private/beta/IdentityConnectionString
  IdentityServerConnectionString:
    file: ../../private/beta/IdentityServerConnectionString

  jdbc.username:
    file: ../../private/beta/jdbc.username
  jdbc.password:
    file: ../../private/beta/jdbc.password
