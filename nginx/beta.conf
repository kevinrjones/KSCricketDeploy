# =============================================================================
# Beta Environment - Nginx Configuration
# =============================================================================
# Routes by Host header to backend services.
# Terminates TLS using origin certificates.
# Cloudflare proxies to this nginx on port 443.
# =============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    server_name ids-beta.knowledgespike.cricket adminui-beta.knowledgespike.cricket web-beta.knowledgespike.cricket api-beta.knowledgespike.cricket _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- IdentityServer ----
server {
    listen 443 ssl;
    server_name ids-beta.knowledgespike.cricket;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    large_client_header_buffers 4 32k;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://ids:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# ---- AdminUI ----
server {
